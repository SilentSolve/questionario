<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Questionario di controllo</title>
<style>:root {
  --bg: #f6f7f4; --card: #ffffff; --ink: #1d2320; --muted: #5c6661; --line: #dfe3dd;
  --accent: #2f6f4f; --accent-ink: #ffffff; --accent-soft: #e3efe8; --warn: #9a3b2a; --warn-soft: #f8e6e1;
  --focus: #1f5fbf; --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141816; --card: #1d2320; --ink: #e8ece9; --muted: #a3ada7; --line: #2f3833;
    --accent: #6fbf94; --accent-ink: #0f1a14; --accent-soft: #23332a; --warn: #f0a08f; --warn-soft: #3a2420; --focus: #8ab4ff; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px; }
.top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.brand { font-weight: 650; font-size: 15px; }
.saved { font-size: 13px; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 99px; margin-top: 8px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.step { font-size: 13px; color: var(--muted); margin-top: 4px; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px; }
h1 { font-size: 26px; line-height: 1.25; margin: 8px 0 6px; }
h2 { font-size: 19px; margin: 24px 0 8px; }
.intro { color: var(--muted); margin: 0 0 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.grid2 > .field { margin-top: 0; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
.field { margin: 18px 0; }
.field.hidden { display: none; }
.label { display: block; font-weight: 600; margin-bottom: 6px; }
.req::after { content: " *"; color: var(--warn); }
.help { font-size: 14px; color: var(--muted); margin: -2px 0 8px; }
input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=time], input[type=password], select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; }
textarea { min-height: 90px; resize: vertical; }
textarea.big { min-height: 260px; }
input:focus, select:focus, textarea:focus { outline: 3px solid var(--focus); outline-offset: 1px; border-color: transparent; }
.unit-wrap { display: flex; align-items: center; gap: 10px; }
.unit-wrap input { max-width: 180px; }
.unit { color: var(--muted); font-size: 15px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.col { flex-direction: column; align-items: stretch; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: block; padding: 10px 14px; min-height: 44px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer; user-select: none; }
.chips.col .chip span { padding-left: 40px; position: relative; }
.chips.col .chip span::before { content: ""; position: absolute; left: 12px; top: 12px; width: 18px; height: 18px; border: 2px solid var(--muted); border-radius: 50%; }
.chips.col .chip input[type=checkbox] + span::before { border-radius: 5px; }
.chips.col .chip input:checked + span::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--card); }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.chip input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 1px; }
.scale .chip span { min-width: 44px; text-align: center; padding: 10px 0; }
.group-title { font-size: 14px; font-weight: 650; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .03em; }
.row { padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-label { font-weight: 550; margin-bottom: 8px; }
.row .chip span { padding: 8px 11px; min-height: 40px; font-size: 15px; }
.meal { display: grid; gap: 8px; }
.meal-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rep-item { border: 1px dashed var(--line); border-radius: 10px; padding: 12px; margin: 10px 0; }
.rep-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.rep-item .field { margin: 10px 0; }
button { font: inherit; cursor: pointer; }
.btn { border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 12px 18px; min-height: 48px; font-weight: 650; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 15px; }
.btn.link { border: 0; background: none; color: var(--warn); padding: 4px 6px; min-height: 0; font-weight: 500; }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
nav.bottom { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--line); z-index: 5; }
.nav-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; gap: 12px; }
.nav-inner .btn { flex: 1; }
details.guide { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; }
details.guide summary { font-weight: 650; cursor: pointer; }
.info { background: var(--accent-soft); border-radius: 10px; padding: 4px 14px; margin: 18px 0; }
.err { color: var(--warn); font-size: 15px; margin-top: 6px; }
.field.invalid input, .field.invalid textarea, .field.invalid .chips .chip span, .field.invalid select { border-color: var(--warn); }
.alert { background: var(--warn-soft); border-radius: var(--radius); padding: 14px 16px; margin: 16px 0; }
.ok { background: var(--accent-soft); border-radius: var(--radius); padding: 14px 16px; margin: 16px 0; }
.files li { margin: 4px 0; }
.small { font-size: 14px; color: var(--muted); }
.stack > * + * { margin-top: 10px; }
.informativa { max-height: 50vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; background: var(--card); font-size: 15px; }
.informativa table { border-collapse: collapse; width: 100%; font-size: 14px; }
.informativa td, .informativa th { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.consent { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.consent input { width: 24px; height: 24px; margin-top: 2px; flex: none; accent-color: var(--accent); }
.foodgroup summary { font-weight: 650; padding: 10px 0; cursor: pointer; }
.foodgroup .count { color: var(--muted); font-weight: 400; font-size: 14px; }
main h1:focus { outline: none; }

ol.passi { margin: 8px 0 0; padding-left: 22px; }
ol.passi li { margin: 0 0 8px; }
#btn-prepara:disabled { opacity: .6; }

figure.fig { margin: 10px 0 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-width: 340px; }
figure.fig svg { display: block; width: 100%; height: auto; font: 11px system-ui, sans-serif; fill: var(--muted); }
figure.fig figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }
.fig .f-corpo { fill: var(--accent-soft); stroke: var(--muted); stroke-width: 1.5; }
.fig .f-arto { fill: none; stroke: var(--accent-soft); stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
.fig .f-muro { stroke: var(--muted); stroke-width: 3; }
.fig .f-libro { fill: var(--muted); }
.fig .f-segno, .fig .f-rif { fill: none; stroke: var(--warn); stroke-width: 1.8; stroke-dasharray: 4 3; }
.fig .f-punto { fill: var(--warn); }
.fig .f-metro { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
.fig .f-guida { stroke: var(--muted); stroke-width: 1; }
.fig .f-freccia { stroke: var(--muted); stroke-width: 1.5; }
.fig .f-punta { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.fig .f-evid { fill: var(--accent); font-weight: 700; }
</style>
</head>

  <div class="top-row"><span class="brand">Controllo nutrizionale</span><span class="saved" id="saved" aria-live="polite"></span></div>

<script>/* ============================================================

/* Disegni per la guida alle misure (SVG in linea, colori dal tema) */
const FIG = {
  altezza: `<svg viewBox="0 0 200 200" role="img" aria-label="Come misurare l'altezza: schiena al muro, libro sulla testa, segno sul muro"><line class="f-muro" x1="104" y1="6" x2="104" y2="192"/><line class="f-muro" x1="6" y1="192" x2="196" y2="192"/><circle class="f-corpo" cx="86" cy="33" r="12"/><rect class="f-corpo" x="76" y="47" width="27" height="62" rx="10"/><rect class="f-corpo" x="80" y="106" width="21" height="84" rx="7"/><rect class="f-libro" x="66" y="15" width="38" height="6" rx="1"/><line class="f-segno" x1="104" y1="21" x2="116" y2="21"/><line class="f-freccia" x1="130" y1="23" x2="130" y2="190"/><path class="f-punta" d="M126 30 L130 22 L134 30 M126 183 L130 191 L134 183"/><text x="138" y="100">altezza</text><text x="112" y="14">segno</text><text x="18" y="12">libro</text></svg>`,

const fig = (k, didascalia) => `<figure class="fig">${FIG[k]}<figcaption>${didascalia}</figcaption></figure>`;

const GUIDA_MISURE = `
<p><b>Ti servono:</b> una bilancia appoggiata su un pavimento duro (non su un tappeto), un metro da sarta non elastico e, per l'altezza, una persona che ti aiuti. Scrivi ogni numero subito dopo averlo letto.</p>
<ul>
<li><b>Peso.</b> Pesati al mattino, dopo essere andato/a in bagno e prima di colazione, senza vestiti o in biancheria intima. Usa sempre la stessa bilancia.</li>
<li><b>Altezza.</b> Togli le scarpe e appoggia talloni, glutei e schiena al muro, talloni uniti e sguardo dritto. Chi ti aiuta appoggia un libro sulla tua testa, ben dritto contro il muro, e segna con una matita il punto sotto il libro. Misura dal pavimento al segno.${fig("altezza", "Talloni, glutei e schiena contro il muro; il libro tocca la testa e il muro.")}</li>
<li><b>Circonferenza vita.</b> In piedi, piedi uniti, pancia rilassata, sulla pelle nuda. Sul fianco trova l'ultima costola e l'osso del bacino: il metro va a metà strada fra i due, parallelo al pavimento, aderente ma senza stringere. Leggi il numero alla fine di un respiro normale, senza trattenere la pancia. Misura due volte; se le misure differiscono di più di 1 cm, fai una terza misura.${fig("vita", "Il metro passa a metà tra l'ultima costola e l'osso del bacino, dritto e senza stringere.")}</li>
<li><b>Circonferenza fianchi.</b> In piedi, piedi uniti. Il metro passa dove i glutei sporgono di più (guardati di lato allo specchio), parallelo al pavimento.${fig("fianchi", "Il punto più sporgente dei glutei, con il metro parallelo al pavimento.")}</li>
</ul>
<p>Per i controlli successivi misurati alla stessa ora e nelle stesse condizioni. Se hai il ciclo, evita di confrontare misure prese nei giorni prima delle mestruazioni.</p>`;

var SECTIONS = [
/* ---------------- LIVELLO 1 ---------------- */
{ key: "s1", level: 1, title: "Dati personali", intro: "Qualche informazione su di te.", fields: [

/* Alimenti da nascondere in base ad allergie e scelte */
function alimentiEsclusi(A) {
  const ex = new Set();
  const all = A["7.1a"] || [];
  const intoll = A["7.2"] || [];
  const diet = A["7.4"];
  const add = arr => arr.forEach(x => ex.add(x));
  const pesce = ALIMENTI[2][1].filter(x => !["gamberi", "calamari o polpo", "cozze o vongole"].includes(x));
  const carne = ALIMENTI[3][1].filter(x => x !== "uova");
  const latticini = ALIMENTI[4][1].filter(x => x !== "bevande vegetali");
  if (all.includes("pesce")) add(pesce);
  if (all.includes("crostacei")) add(["gamberi"]);
  if (all.includes("molluschi")) add(["calamari o polpo", "cozze o vongole"]);
  if (all.includes("uova")) add(["uova"]);
  if (all.includes("latte")) add(latticini);
  if (all.includes("soia")) add(["edamame", "tofu", "tempeh"]);
  if (all.includes("arachidi")) add(["burro di arachidi"]);
  if (all.includes("frutta a guscio")) add(["noci", "mandorle", "nocciole", "pistacchi"]);
  /* glutine e lattosio: non si nascondono, esistono le versioni senza glutine o senza lattosio */
  if (diet === "pescetariana") add(carne);
  if (diet === "vegetariana con latte e uova") { add(carne); add(ALIMENTI[2][1]); }
  if (diet === "vegetariana con solo latte") { add(carne); add(ALIMENTI[2][1]); add(["uova"]); }
  if (diet === "vegana") { add(carne); add(ALIMENTI[2][1]); add(["uova"]); add(latticini); }
  return ex;
}

function chipGroup(f, name, type, opts, getV, setV, cls = "") {
  const box = h("div", { class: "chips " + cls, role: type === "radio" ? "radiogroup" : "group" });
  for (const o of opts) {
    const inp = h("input", { type, name, value: o });
    const cur = getV();
    if (type === "radio" ? cur === o : Array.isArray(cur) && cur.includes(o)) inp.checked = true;
    inp.addEventListener("change", () => {
      if (type === "radio") setV(o);
      else {
        let arr = Array.isArray(getV()) ? getV().slice() : [];
        if (inp.checked) {
          if (f.exclusive && o === f.exclusive) arr = [o];
          else { arr = arr.filter(x => x !== f.exclusive); arr.push(o); }
        } else arr = arr.filter(x => x !== o);
        setV(arr);
        if (f.exclusive) box.querySelectorAll("input").forEach(i => { i.checked = arr.includes(i.value); });
      }
    });
    box.append(h("label", { class: "chip" }, inp, h("span", {}, o)));
  }
  return box;
}

function inputFor(f, getV, setV, idAttr) {
  const t = f.type;
  if (["text", "email", "tel", "date", "time"].includes(t)) {
    const i = h("input", { type: t, id: idAttr, autocomplete: f.auto || "off" });
    i.value = getV() || "";
    i.addEventListener("input", () => setV(i.value));
    return i;
  }
  if (t === "number") {
    const i = h("input", { type: "text", inputmode: "decimal", id: idAttr, autocomplete: "off" });
    i.value = getV() ?? "";
    i.addEventListener("input", () => setV(i.value.trim()));
    return f.unit ? h("div", { class: "unit-wrap" }, i, h("span", { class: "unit" }, f.unit)) : i;
  }
  if (t === "textarea") {
    const i = h("textarea", { id: idAttr, class: f.big ? "big" : "" });
    i.value = getV() || "";
    i.addEventListener("input", () => setV(i.value));
    return i;
  }
  return null;
}

/* ---------------- validazione ---------------- */
function validateField(f) {
  if (f.type === "info" || !visible(f)) return "";
  const v = S.A[f.id];
  if (f.type === "number" && !isEmpty(v)) {
    const x = num(v);
    if (isNaN(x)) return "Scrivi solo un numero.";
    if (f.min != null && x < f.min || f.max != null && x > f.max) return "Controlla il valore: deve essere tra " + f.min + " e " + f.max + ".";
  }
  if (f.id === "1.5" && v) { const a = age(v); if (a == null || a > 110 || a < 0) return "Controlla la data di nascita."; }
  if (f.type === "email" && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return "Controlla l'indirizzo email.";
  if (!f.req) return "";
  if (f.type === "grid") return f.rows.every(([rk]) => (v || {})[rk]) ? "" : "Rispondi a tutte le righe.";
  if (f.type === "meals") return PASTI.every((p, i) => (v || {})[i] && v[i].fai) ? "" : "Indica per ogni pasto se lo fai.";
  if (f.type === "repeat") return (v || []).some(x => Object.values(x || {}).some(y => !isEmpty(y))) ? "" : "Aggiungi almeno una voce.";
  return isEmpty(v) ? "Questa risposta è necessaria." : "";
}

function validatePage(sec) {
  let first = null;
  document.querySelectorAll("main .field[data-fid]").forEach(wrap => {
    const msg = validateField(wrap._f);
    wrap.classList.toggle("invalid", !!msg);
    wrap.querySelector(":scope > .err").textContent = msg;
    if (msg && !first) first = wrap;
  });
  if (first) { first.scrollIntoView({ behavior: "smooth", block: "center" }); const i = first.querySelector("input, textarea, select"); if (i) setTimeout(() => i.focus({ preventScroll: true }), 300); }
  return !first;
}

          puoCondividere ? h("button", { type: "button", class: "btn", id: "btn-share", onclick: condividi }, "Invia il file (WhatsApp, Mail…)") : null,
          h("button", { type: "button", class: puoCondividere ? "btn ghost" : "btn", id: "btn-download", onclick: scarica }, "Salva il file")),
        h("p", { class: "small" }, "Nome del file: " + name),
        guidaInvio(pronto.pw, puoCondividere));
    } catch (e) {
      msg.className = "err"; msg.textContent = "Non è stato possibile creare il file. Riprova.";
    }
    btnPrep.disabled = false; btnPrep.textContent = "1. Prepara di nuovo il file";
  };
  [pw1, pw2].forEach(x => x.addEventListener("input", () => { if (pronto) { pronto = null; step2.innerHTML = ""; btnPrep.textContent = "1. Prepara il file"; msg.className = ""; msg.textContent = "Hai cambiato la password: prepara di nuovo il file."; } }));
  if (cryptoOK) {
    box.append(h("div", {}, h("div", { class: "label" }, "Proteggi il file con una password (consigliato)"),
      h("div", { class: "help" }, "Chi riceve il file potrà aprirlo solo con questa password. Lascia vuoto se non vuoi usarla."),
      h("div", { class: "grid2" }, h("div", { class: "field" }, h("label", { class: "label", for: "pw1" }, "Password"), pw1), h("div", { class: "field" }, h("label", { class: "label", for: "pw2" }, "Ripeti la password"), pw2))));
  }
  const btnPrep = h("button", { type: "button", class: "btn", id: "btn-prepara", onclick: prepara }, "1. Prepara il file");
  box.append(btnPrep, msg, step2);
  return box;
}

function pageEndL1() {
  S.l1done = true; saveSoon();
  const box = h("div", {}, h("h1", {}, "Prima parte completata"),
    h("p", { class: "intro" }, "Grazie! Puoi inviare subito le risposte oppure continuare con la seconda parte, che mi aiuta a conoscerti meglio: misure ed esami, una giornata alimentare, i tuoi gusti e uno spazio libero."));
  if (richiedeValutazione(S.A)) box.append(h("div", { class: "alert" }, "Grazie. Alcune risposte richiedono una valutazione personalizzata: dopo aver ricevuto il file ti contatterò io."));
  box.append(h("h2", {}, "Continua"), h("button", { type: "button", class: "btn", id: "btn-l2", onclick: () => go(IDX_ENDL1 + 1) }, "Continua con la seconda parte (circa 15 minuti)"),
    h("h2", {}, "Oppure invia ora la prima parte"), h("p", { class: "small" }, "Se invii ora, potrai completare la seconda parte più tardi da questo stesso dispositivo e inviare un nuovo file."), exportBox(1));
  return box;
}

function pageFinal() {
  S.l2done = true; saveSoon();
  const box = h("div", {}, h("h1", {}, "Questionario completato"),
    h("p", { class: "intro" }, "Grazie per il tempo che hai dedicato. Ora crea il file con le tue risposte e invialo."));
  if (richiedeValutazione(S.A)) box.append(h("div", { class: "alert" }, "Alcune risposte richiedono una valutazione personalizzata: dopo aver ricevuto il file ti contatterò io."));
  box.append(exportBox(LIVELLO_FINALE));
  let armed = false;
  const del = h("button", { type: "button", class: "btn ghost", id: "btn-clear", onclick: () => {
    if (!armed) { armed = true; del.textContent = "Tocca di nuovo per confermare la cancellazione"; return; }
    clearSaved(); S = freshState(); FILES = []; go(0);
  } }, "Cancella le risposte da questo dispositivo");
  box.append(h("h2", {}, "Dopo l'invio"), h("p", { class: "small" }, "Se usi un dispositivo condiviso, cancella le risposte dopo aver inviato il file."), del);
  return box;
}

/* ---------------- esportazione ---------------- */
function collectAnswers(level) {
  const out = {};
  SECTIONS.filter(s => s.level <= level).forEach(sec => sec.fields.forEach(f => {
    if (!f.id || f.type === "info" || f.type === "file" || !visible(f)) return;
    let v = S.A[f.id];
    if (isEmpty(v)) return;
    if (f.type === "number") v = num(v);
    if (f.type === "repeat") v = v.filter(x => Object.values(x || {}).some(y => !isEmpty(y)));
    if (f.type === "meals") v = PASTI.map((p, i) => Object.assign({ pasto: p }, v[i] || {}));
    if (f.type === "foods") { const ex = alimentiEsclusi(S.A); v = Object.fromEntries(Object.entries(v).filter(([k]) => !ex.has(k))); }
    if (!isEmpty(v)) out[f.id] = v;
  }));
  const eta = age(S.A["1.5"]);
  return { out, eta };
}

function slug(s) { return (s || "paziente").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "paziente"; }

const b64 = buf => { let s = ""; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

async function encrypt(text, password) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));
  return { schema: "anamnesi-nutrizionale-cifrata", v: 1, kdf: { name: "PBKDF2", hash: "SHA-256", iterazioni: 250000, salt: b64(salt) }, cifra: { name: "AES-GCM", iv: b64(iv) }, dati: b64(ct) };
}

async function buildFile(level, password) {
  const { out, eta } = collectAnswers(level);
  const payload = {
    schema: FORM_META.schema, versione: CONFIG.versione, creato: S.created, esportato: nowISO(),
    livello: level, eta_alla_compilazione: eta, consensi: S.consents, risposte: out,
    note: Object.fromEntries(Object.entries(S.notes).filter(([, v]) => v && v.trim())),
    allegati: FILES
  };
  const text = JSON.stringify(payload, null, 2);
  const date = nowISO().slice(0, 10);
  const base = FORM_META.prefisso + "_" + slug(S.A["1.4"]) + "_" + date + (FORM_META.dueParti ? "_parte" + level : "");
  if (password) {
    const obj = await encrypt(text, password);
    return { blob: new Blob([JSON.stringify(obj)], { type: "text/plain" }), name: base + "_protetto.txt" };
  }
  return { blob: new Blob([text], { type: "text/plain" }), name: base + ".txt" };
}

/* ---------------- navigazione ---------------- */
function progress() {
  const i = S.page;
  let pct, label;
  if (IDX_ENDL1 < 0) { const n = PAGES.length - 1; pct = i / n; label = i === 0 ? "Inizio" : i === n ? "Fine" : "Sezione " + i + " di " + (n - 1); }
  else if (i <= IDX_ENDL1) { pct = i / IDX_ENDL1; label = i === 0 ? "Inizio" : i === IDX_ENDL1 ? "Prima parte completata" : "Prima parte · " + i + " di " + (IDX_ENDL1 - 1); }
  else { const n = PAGES.length - 1 - IDX_ENDL1; const k = i - IDX_ENDL1; pct = k / n; label = k === n ? "Fine" : "Seconda parte · " + k + " di " + (n - 1); }
  $("#bar").style.width = Math.round(pct * 100) + "%";
  $("#step").textContent = label;
}

function render() {
  const p = PAGES[S.page];
  const main = $("main");
  main.innerHTML = "";
  if (p.kind === "consent") main.append(pageConsent());
  else if (p.kind === "endL1") main.append(pageEndL1());
  else if (p.kind === "final") main.append(pageFinal());
  else if (p.kind === "stopAge") main.append(p.el);
  else {
    const sec = p.s;
    main.append(h("h1", {}, sec.title), h("p", { class: "intro" }, sec.intro));
    if (sec.guide) main.append(h("details", { class: "guide" }, h("summary", {}, "Come mi misuro?"), h("div", { html: sec.guide })));
    let pair = null;
    sec.fields.forEach(f => {
      const el = renderField(f, sec);
      if (f.half) { if (!pair) { pair = h("div", { class: "grid2" }); main.append(pair); } pair.append(el); if (pair.children.length === 2) pair = null; }
      else { pair = null; main.append(el); }
    });
    if (!sec.noNotes) {
      const ta = h("textarea", { id: "note_" + sec.key });
      ta.value = S.notes[sec.key] || "";
      ta.addEventListener("input", () => { S.notes[sec.key] = ta.value; saveSoon(); });
      main.append(h("div", { class: "field" }, h("label", { class: "label", for: "note_" + sec.key }, "Vuoi aggiungere qualcosa su questo argomento?"), ta));
    }
    refreshVisibility();
  }
  // barra di navigazione
  const back = $("#back"), next = $("#next");
  back.disabled = S.page === 0;
  next.style.display = (p.kind === "final" || p.kind === "stopAge") ? "none" : "";
  next.textContent = p.kind === "consent" ? "Inizia" : p.kind === "endL1" ? "Seconda parte" : (PAGES[S.page + 1] && PAGES[S.page + 1].kind === "final") ? "Concludi" : "Avanti";
  progress();
  window.scrollTo(0, 0);
  const h1 = $("main h1"); if (h1) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
}

function go(i) { S.page = Math.max(0, Math.min(PAGES.length - 1, i)); save(); render(); }

function next() {
  const p = PAGES[S.page];
  if (p.kind === "consent" && !consentOK()) return;
  if (p.kind === "section" && !validatePage(p.s)) return;
  if (p.kind === "section" && p.s.key === "s1") {
    const a = age(S.A["1.5"]);
    if (a != null && a < 18) {
      const el = h("div", {}, h("h1", {}, "Grazie per l'interesse"),
        h("p", {}, "Questo questionario è pensato per persone maggiorenni. Se hai meno di 18 anni, parlane con i tuoi genitori e con il tuo medico, che sapranno indicarti a chi rivolgerti."),
        h("button", { type: "button", class: "btn ghost", onclick: () => { go(S.page); } }, "Ho sbagliato la data di nascita"));
      main_stop(el); return;
    }
  }
  go(S.page + 1);
}
function main_stop(el) {
  const main = $("main"); main.innerHTML = ""; main.append(el);
  $("#next").style.display = "none"; window.scrollTo(0, 0);
}

/* ---------------- avvio ---------------- */
function start() {
  $("#next").addEventListener("click", next);
  $("#back").addEventListener("click", () => go(S.page - 1));
  const saved = loadSaved();
  if (saved && saved.A && (Object.keys(saved.A).length || saved.page > 0)) {
    S = Object.assign(freshState(), saved);
    const main = $("main");
    main.append(h("h1", {}, "Bentornato/a"), h("p", { class: "intro" }, "Su questo dispositivo c'è una compilazione in corso."),
      h("div", { class: "chips" },
        h("button", { type: "button", class: "btn", id: "btn-resume", onclick: () => render() }, "Riprendi da dove eri rimasto/a"),
        h("button", { type: "button", class: "btn ghost", id: "btn-restart", onclick: () => { clearSaved(); S = freshState(); FILES = []; render(); } }, "Ricomincia da capo")));
    $("#next").style.display = "none"; $("#back").disabled = true; progress();
  } else render();
  save();
}
document.addEventListener("DOMContentLoaded", start);
})();
</script>
